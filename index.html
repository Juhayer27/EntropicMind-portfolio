<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111412">
<meta name="description" content="EntropicMind portfolio: websites and web applications built by an independent technology and digital innovation studio.">
<title>EntropicMind | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js");setTimeout(function(){document.documentElement.classList.add("ready")},4000)</script>
<style>
:root{--bg:#111412;--sf:#171c19;--g:#00e6a0;--tx:#f0f4f1;--mu:#9aa59e;--bd:rgba(224,244,232,.1);--e:cubic-bezier(.2,.9,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"Manrope",system-ui,sans-serif;line-height:1.6;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:6px}
::selection{background:var(--g);color:#07110c}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px circle at var(--gx,70%) var(--gy,10%),rgba(0,230,160,.09),transparent 60%)}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,44px)}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.05em}
.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.brand b{color:var(--g)}
.hint{font:500 11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
main{flex:1;position:relative;width:min(1080px,calc(100% - 36px));margin:0 auto;padding:10px 0 60px}
.view{display:none}.view.on{display:block}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--g);font:500 11px "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--g)}
.sub{color:var(--mu);max-width:54ch}

/* home */
#v-home{text-align:center;padding-top:clamp(10px,4vh,50px)}
.mark{position:relative;width:128px;height:128px;margin:0 auto 26px;display:grid;place-items:center}
.mark img{width:78px;height:78px;object-fit:contain;border-radius:20px;filter:drop-shadow(0 0 22px rgba(0,230,160,.5));animation:pl 4s ease-in-out infinite}
.rg{position:absolute;inset:0;border:1px solid rgba(0,230,160,.3);border-radius:50%;animation:spin 14s linear infinite}
.rg::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 16px var(--g)}
.r2{inset:-14px;border-color:rgba(0,230,160,.14);animation-duration:22s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pl{50%{filter:drop-shadow(0 0 40px rgba(0,230,160,.85))}}
h1{font-size:clamp(38px,8vw,76px);line-height:1.07;letter-spacing:-.07em;font-weight:800;margin:16px auto 14px;max-width:14ch;perspective:700px}
h1 em{font-style:normal;color:var(--g)}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(70%) rotateX(-90deg);filter:blur(8px);transform-origin:50% 100%;transition:opacity .8s var(--e) calc(var(--i)*30ms + .2s),transform .9s var(--e) calc(var(--i)*30ms + .2s),filter .8s calc(var(--i)*30ms + .2s)}
.ready .ch{opacity:1;transform:none;filter:none}
#v-home .sub{margin:0 auto 42px}
.js #v-home .mark,.js #v-home .eyebrow,.js #v-home .sub,.js .choice{opacity:0;transform:translateY(26px);transition:opacity .9s var(--e) calc(.35s + var(--n,0)*.12s),transform .9s var(--e) calc(.35s + var(--n,0)*.12s)}
.js.ready #v-home .mark,.js.ready #v-home .eyebrow,.js.ready #v-home .sub,.js.ready .choice{opacity:1;transform:none}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;text-align:left}
.choice{position:relative;overflow:hidden;display:block;padding:34px 30px 30px;min-height:290px;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(160deg,#16231c,var(--sf) 60%)}
.js.ready .choice.done{transition:transform .2s ease-out,border-color .3s,box-shadow .3s}
.choice::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(0,230,160,.18),transparent 60%);opacity:0;transition:opacity .3s}
.choice:hover{border-color:rgba(0,230,160,.55);box-shadow:0 0 60px rgba(0,230,160,.1)}
.choice:hover::before{opacity:1}
.choice svg{position:relative;width:58px;height:58px;stroke:var(--g);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:34px;transition:transform .5s var(--e)}
.choice:hover svg{transform:translateY(-4px) scale(1.08) rotate(-4deg)}
.choice>*{position:relative}
.choice h2{font-size:clamp(28px,4vw,38px);letter-spacing:-.05em;line-height:1.1}
.choice p{color:var(--mu);font-size:14px;margin:8px 0 26px;max-width:34ch}
.choice .ct{display:flex;justify-content:space-between;align-items:center;font:500 12px "DM Mono",monospace;color:var(--g);letter-spacing:.08em;text-transform:uppercase}
.choice .ar{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(0,230,160,.4);border-radius:50%;font-size:18px;transition:background .3s,color .3s,transform .4s var(--e)}
.choice:hover .ar{background:var(--g);color:#07110c;transform:rotate(-45deg)}

/* list view */
.back{display:inline-flex;align-items:center;gap:10px;margin:14px 0 30px;padding:10px 18px;border:1px solid var(--bd);border-radius:999px;background:rgba(255,255,255,.02);font-size:14px;font-weight:600;transition:border-color .3s,color .3s,gap .3s}
.back:hover{border-color:var(--g);color:var(--g);gap:14px}
.lh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:30px}
#v-list h2{font-size:clamp(36px,7vw,68px);letter-spacing:-.065em;line-height:1.05;margin:12px 0 10px}
.count{display:flex;align-items:baseline;gap:12px}
.count span{font:500 clamp(60px,12vw,110px)/1 "DM Mono",monospace;letter-spacing:-.06em;background:linear-gradient(120deg,var(--g),#b8ffe8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.count small{max-width:11ch;color:var(--mu);font-size:13px;line-height:1.4}
.search{display:flex;align-items:center;gap:12px;padding:0 18px;border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.02);margin-bottom:20px;transition:border-color .3s,box-shadow .3s}
.search:focus-within{border-color:var(--g);box-shadow:0 0 30px rgba(0,230,160,.12)}
.search input{flex:1;background:none;border:0;outline:0;padding:15px 0;font-size:15px}
.search kbd{font:11px "DM Mono",monospace;color:var(--mu);border:1px solid var(--bd);border-radius:5px;padding:1px 7px}
ol{list-style:none;border-top:1px solid var(--bd)}
ol li{border-bottom:1px solid var(--bd);opacity:0;animation:ri .8s var(--e) forwards;animation-delay:calc(var(--i)*90ms + .3s)}
@keyframes ri{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
ol li[hidden]{display:none}
ol a{position:relative;overflow:hidden;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;padding:26px 14px}
ol a::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,230,160,.13),transparent);transform:scaleX(0);transform-origin:0 50%;transition:transform .6s var(--e)}
ol a:hover::before,ol a:focus-visible::before{transform:scaleX(1)}
ol a>*{position:relative}
.no{font:500 14px "DM Mono",monospace;color:var(--g)}
.tx b{display:block;font-size:clamp(21px,3.4vw,32px);letter-spacing:-.045em;line-height:1.2;transition:transform .5s var(--e),color .3s}
ol a:hover .tx b{transform:translateX(10px);color:var(--g)}
.tx i{display:block;font-style:normal;color:var(--mu);font-size:14px;max-width:62ch;margin-top:5px}
.tx u{display:block;text-decoration:none;font:11px "DM Mono",monospace;color:#66746a;margin-top:6px}
.go{display:inline-flex;align-items:center;gap:10px;font:500 12px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--g);border:1px solid rgba(0,230,160,.35);padding:10px 16px;border-radius:999px;transition:background .3s,color .3s}
.go i{font-style:normal;transition:transform .4s var(--e)}
ol a:hover .go{background:var(--g);color:#07110c}ol a:hover .go i{transform:translate(3px,-3px)}
#none{color:var(--mu);padding:30px 6px}
footer{padding:26px 18px 34px;text-align:center;color:#66746a;font-size:12px;border-top:1px solid var(--bd)}

/* preloader + wipe */
#pre,#wipe{position:fixed;inset:0;display:grid;place-items:center;z-index:100;pointer-events:none}
#pre{background:var(--bg);transition:opacity .7s .1s,visibility .7s .1s;animation:pOut .01s 4.2s forwards}
#pre.go{opacity:0;visibility:hidden}
@keyframes pOut{to{visibility:hidden}}
.lw{position:relative;width:132px;height:132px;display:grid;place-items:center}
.lw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lw circle{fill:none;stroke:var(--g);stroke-width:1.5;stroke-dasharray:352;stroke-dashoffset:352;filter:drop-shadow(0 0 6px var(--g));animation:dr 1.2s .1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.lw img{width:90px;height:90px;object-fit:contain;border-radius:22px;opacity:0;transform:scale(.6);animation:li 1s .3s var(--e) forwards}
@keyframes li{to{opacity:1;transform:none}}
#wipe{z-index:90;background:linear-gradient(135deg,#0d3b2c,#08261c);visibility:hidden;clip-path:circle(0 at var(--x,50%) var(--y,50%))}
#wipe img{width:84px;height:84px;object-fit:contain;border-radius:20px;filter:drop-shadow(0 0 30px rgba(0,230,160,.7))}
#wipe.in{visibility:visible;clip-path:circle(150% at var(--x) var(--y));transition:clip-path .65s cubic-bezier(.77,0,.18,1)}
#wipe.out{visibility:visible;clip-path:circle(150% at var(--x) var(--y));opacity:0;transition:opacity .6s}
@media(max-width:640px){ol a{grid-template-columns:44px 1fr;padding:22px 6px}.go{grid-column:2;justify-self:start}.hint,.search kbd{display:none}.choice{min-height:240px}}
@media(prefers-reduced-motion:reduce){*,.ch,.js .choice{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;filter:none!important}}
</style>
</head>
<body>
<div id="pre" aria-hidden="true"><div class="lw"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56"/></svg><img data-logo alt=""></div></div>
<div id="wipe" aria-hidden="true"><img data-logo alt=""></div>
<canvas id="bg" aria-hidden="true"></canvas><div id="glow"></div>

<header class="top">
  <a class="brand" href="#home" aria-label="EntropicMind home"><img data-logo alt="EntropicMind logo"><span>Entropic<b>Mind</b></span></a>
  <span class="hint">Portfolio</span>
</header>

<main>
  <section id="v-home" class="view on">
    <div class="mark"><div class="rg"></div><div class="rg r2"></div><img data-logo alt="EntropicMind logo"></div>
    <p class="eyebrow">Our portfolio</p>
    <h1 id="h1">Ideas turned into <em>live products.</em></h1>
    <p class="sub">Choose a category to explore what we have built.</p>
    <div class="choices" id="choices"></div>
  </section>

  <section id="v-list" class="view">
    <a class="back" href="#home">← Back</a>
    <div class="lh">
      <div><p class="eyebrow" id="lk">Portfolio</p><h2 id="lt"></h2><p class="sub" id="ls"></p></div>
      <div class="count"><span id="ln">00</span><small id="ll"></small></div>
    </div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search projects…" autocomplete="off"><kbd>/</kbd></label>
    <ol id="rows"></ol>
    <p id="none" hidden>No projects match your search.</p>
  </section>
</main>

<footer>© <span id="yr"></span> EntropicMind · Independent technology &amp; digital innovation studio</footer>

<script src="works.js"></script>
<script>
(function(){
var d=document,h=d.documentElement,E=window.EM||{categories:{}},C=E.categories,R=matchMedia("(prefers-reduced-motion:reduce)").matches,F=matchMedia("(hover:hover) and (pointer:fine)").matches;
function $(s){return d.querySelector(s)}
function el(t,c,x){var e=d.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var pad=function(n){return n<10?"0"+n:""+n};
$("#yr").textContent=new Date().getFullYear();

/* logo everywhere comes from works.js */
[].forEach.call(d.querySelectorAll("[data-logo]"),function(i){i.src=E.logo});
var fav=el("link");fav.rel="icon";fav.href=E.logo;d.head.appendChild(fav);

/* headline 3D letter flip */
var n=0;
function split(p){[].slice.call(p.childNodes).forEach(function(c){if(c.nodeType==3){var f=d.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(function(t){if(!t)return;if(/^\s+$/.test(t)){f.appendChild(d.createTextNode(" "));return}var w=el("span","wd");t.split("").forEach(function(k){var s=el("span","ch",k);s.setAttribute("aria-hidden","true");s.style.setProperty("--i",n++);w.appendChild(s)});f.appendChild(w)});p.replaceChild(f,c)}else if(c.nodeType==1)split(c)})}
var h1=$("#h1");if(!R){h1.setAttribute("aria-label",h1.textContent);split(h1)}

/* category cards, built from works.js */
var icons={websites:'<svg viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="42" rx="6"/><path d="M6 22h52M14 16h.1M21 16h.1M28 16h.1M16 34h18M16 42h30"/></svg>',webapps:'<svg viewBox="0 0 64 64"><rect x="8" y="8" width="20" height="20" rx="5"/><rect x="36" y="8" width="20" height="20" rx="5"/><rect x="8" y="36" width="20" height="20" rx="5"/><path d="M46 36v20M36 46h20"/></svg>'};
var box=$("#choices");
Object.keys(C).forEach(function(k,i){var c=C[k],a=el("a","choice");a.href="#"+k;a.style.setProperty("--n",i+3);
  var w=el("div");w.innerHTML=icons[k]||icons.webapps;a.appendChild(w.firstChild);
  a.appendChild(el("h2","",c.title));a.appendChild(el("p","",c.blurb||""));
  var ct=el("div","ct"),cnt=c.items.length;ct.appendChild(el("span","",pad(cnt)+" "+(cnt==1?c.noun.replace(/s$/,""):c.noun)));ct.appendChild(el("span","ar","→"));a.appendChild(ct);box.appendChild(a);
  setTimeout(function(){a.classList.add("done")},2800)});
if(F&&!R)[].forEach.call(d.querySelectorAll(".choice"),function(c){c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty("--mx",x+"px");c.style.setProperty("--my",y+"px");if(c.classList.contains("done"))c.style.transform="perspective(900px) rotateX("+((.5-y/r.height)*8)+"deg) rotateY("+((x/r.width-.5)*8)+"deg)"});c.addEventListener("pointerleave",function(){c.style.transform=""})});

/* project list view */
var rows=$("#rows"),q=$("#q"),route="home",busy=0,pend=null;
function host(u){try{return new URL(u).host}catch(e){return u}}
function count(t,to){if(R||!to){t.textContent=pad(to);return}var t0=performance.now();(function s(now){var p=Math.min(1,(now-t0)/900);t.textContent=pad(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(s)})(t0)}
function render(k){var c=C[k],it=c.items;$("#lt").textContent=c.title;$("#ls").textContent=c.blurb||"";$("#lk").textContent="Portfolio / "+c.title;
  $("#ll").textContent="Total "+c.noun+" made so far";count($("#ln"),it.length);rows.innerHTML="";q.value="";$("#none").hidden=true;
  it.forEach(function(p,i){var li=el("li"),a=el("a");li.style.setProperty("--i",i);li.dataset.s=(p.name+" "+(p.desc||"")).toLowerCase();a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(el("span","no",pad(i+1)));var tx=el("span","tx");tx.appendChild(el("b","",p.name));tx.appendChild(el("i","",p.desc||"A live EntropicMind project. Open it to explore."));tx.appendChild(el("u","",host(p.url)));a.appendChild(tx);
    var g=el("span","go","Visit ");g.appendChild(el("i","","↗"));a.appendChild(g);li.appendChild(a);rows.appendChild(li)})}
q.addEventListener("input",function(){var v=q.value.trim().toLowerCase(),vis=0;[].forEach.call(rows.children,function(li){var ok=!v||li.dataset.s.indexOf(v)>-1;li.hidden=!ok;if(ok)vis++});$("#none").hidden=vis>0});

/* router with circular wipe transition */
var wp=$("#wipe"),lx=innerWidth/2,ly=innerHeight/2;
addEventListener("pointerdown",function(e){lx=e.clientX;ly=e.clientY},{passive:true});
function parse(){var k=location.hash.slice(1);return C[k]?k:"home"}
function swap(k){route=k;$("#v-home").classList.toggle("on",k==="home");$("#v-list").classList.toggle("on",k!=="home");if(k!=="home")render(k);d.title=k==="home"?"EntropicMind | Portfolio":C[k].title+" | EntropicMind";scrollTo(0,0)}
function go(k){if(k===route)return;if(busy){pend=k;return}if(R){swap(k);return}busy=1;wp.style.setProperty("--x",lx+"px");wp.style.setProperty("--y",ly+"px");wp.className="in";
  setTimeout(function(){swap(k);wp.className="out";setTimeout(function(){wp.className="";busy=0;if(pend){var p=pend;pend=null;go(p)}},650)},700)}
addEventListener("hashchange",function(){go(parse())});
addEventListener("keydown",function(e){if(e.key==="Escape"&&route!=="home")location.hash="home";else if(e.key==="/"&&route!=="home"&&d.activeElement!==q){e.preventDefault();q.focus()}});
if(parse()!=="home")swap(parse());

/* intro (once per session) */
var pre=$("#pre"),seen=0;try{seen=sessionStorage.getItem("emi")}catch(e){}
if(R||seen){pre.remove();h.classList.add("ready")}else setTimeout(function(){pre.classList.add("go");h.classList.add("ready");try{sessionStorage.setItem("emi",1)}catch(e){}setTimeout(function(){pre.remove()},900)},1700);

/* cursor glow */
if(F)addEventListener("pointermove",function(e){h.style.setProperty("--gx",e.clientX+"px");h.style.setProperty("--gy",e.clientY+"px")},{passive:true});

/* particle network background */
var c=$("#bg"),x=c.getContext("2d"),W,H,P=[],m={x:-999,y:-999},dp=Math.min(devicePixelRatio||1,1.5),lw=0;
function init(){if(innerWidth===lw&&P.length)return;lw=innerWidth;W=c.width=innerWidth*dp;H=c.height=innerHeight*dp;P=[];var k=Math.min(70,Math.floor(innerWidth*innerHeight/16000));for(var i=0;i<k;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4*dp,vy:(Math.random()-.5)*.4*dp})}
addEventListener("pointermove",function(e){m.x=e.clientX*dp;m.y=e.clientY*dp},{passive:true});
function draw(){x.clearRect(0,0,W,H);var L=150*dp,i,j,a,b;for(i=0;i<P.length;i++){a=P[i];a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
  for(j=i+1;j<P.length;j++){b=P[j];var u=a.x-b.x,v=a.y-b.y,dd=Math.sqrt(u*u+v*v);if(dd<L){x.strokeStyle="rgba(0,230,160,"+(.16*(1-dd/L))+")";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
  var mu=a.x-m.x,mv=a.y-m.y,md=Math.sqrt(mu*mu+mv*mv);if(md<200*dp){x.strokeStyle="rgba(0,230,160,"+(.4*(1-md/(200*dp)))+")";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke()}
  x.fillStyle="rgba(0,230,160,.55)";x.beginPath();x.arc(a.x,a.y,1.3*dp,0,6.283);x.fill()}
  if(!R&&!d.hidden)requestAnimationFrame(draw)}
init();addEventListener("resize",init);d.addEventListener("visibilitychange",function(){if(!d.hidden&&!R)requestAnimationFrame(draw)});draw();
})();
</script>
</body>
</html>
